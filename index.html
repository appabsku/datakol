<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembaca & Ekstraktor Multi-PDF Kolektibilitas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- PapaParse untuk Parsing CSV Akurat & Presisi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root{
            --mdr-navy-900:#00234A;
            --mdr-navy-800:#003A70;
            --mdr-navy-700:#004B8D;
            --mdr-blue-500:#0067B8;
            --mdr-blue-100:#E7F1FB;
            --mdr-gold-500:#FFC629;
            --mdr-gold-600:#F2A900;
            --mdr-bg:#EEF3F9;
            --mdr-green:#00A651;
            --mdr-amber:#F5A623;
            --mdr-orange:#F0740A;
            --mdr-red:#E4392E;
            --mdr-maroon:#7A1E1E;
        }
        body{
            background: radial-gradient(1200px 400px at 100% -10%, rgba(255,198,41,0.10), transparent 60%), var(--mdr-bg);
            font-family: 'Segoe UI', ui-sans-serif, system-ui, -apple-system, sans-serif;
        }
        .livin-header{
            background: linear-gradient(120deg, var(--mdr-navy-900) 0%, var(--mdr-navy-800) 55%, var(--mdr-blue-500) 100%);
            position: relative; overflow: hidden;
        }
        .btn-gold{ background: linear-gradient(135deg, var(--mdr-gold-500), var(--mdr-gold-600)); color: var(--mdr-navy-900); }
        .btn-navy{ background: linear-gradient(135deg, var(--mdr-navy-800), var(--mdr-blue-500)); color: white; }
        .btn-outline-navy{ background: white; color: var(--mdr-navy-800); border: 1.5px solid var(--mdr-navy-800); }
        
        table thead th{ background: linear-gradient(180deg, var(--mdr-navy-800), var(--mdr-navy-900)); color: #F5F8FC; font-weight: 700; }
        table thead th.col-sudahbayar{ background: linear-gradient(180deg, var(--mdr-gold-500), var(--mdr-gold-600)); color: var(--mdr-navy-900); }
        table thead th.col-basil{ background: linear-gradient(180deg, #00A651, #007A3B); color: white; }
        tbody tr.row-even{ background: #ffffff; }
        tbody tr.row-odd{ background: var(--mdr-blue-100); }
        tbody tr.row-subtotal{ background: linear-gradient(90deg, #FFF6DE, #FFEBB0); border-y: 2px solid var(--mdr-gold-600); }
        
        .kol-badge{ display:inline-flex; align-items:center; justify-content:center; min-width: 26px; height: 22px; padding: 0 6px; border-radius: 999px; font-weight: 800; font-size: 11px; color: white; }
        .kol-1{ background: var(--mdr-green); }
        .kol-2{ background: var(--mdr-amber); color:#3A2900;}
        .kol-3{ background: var(--mdr-blue-500); }
        .kol-4{ background: var(--mdr-red); }
        .kol-5{ background: var(--mdr-maroon); }
        
        .filter-segment{ background: var(--mdr-navy-900); border-radius: 999px; padding: 4px; display:inline-flex; gap: 2px; }
        .filter-segment label{ position: relative; cursor: pointer; }
        .filter-segment input{ position:absolute; opacity:0; pointer-events:none; }
        .filter-segment span{ display:inline-flex; align-items:center; padding: 7px 14px; border-radius: 999px; font-size: 11.5px; font-weight: 600; color: #C9D8EA; }
        .filter-segment input:checked + span{ background: var(--mdr-gold-500); color: var(--mdr-navy-900); }
        
        .top-menu{ display:flex; justify-content:center; gap:10px; margin-bottom:14px; }
        .top-menu a{ background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.35); color:#fff; padding:8px 16px; border-radius:20px; font-size:12.5px; font-weight:600; text-decoration:none; }
        .top-menu a.aktif{ background: var(--mdr-gold-500); color: var(--mdr-navy-900); border-color: var(--mdr-gold-500); }
    </style>
</head>
<body class="min-h-screen text-slate-800 p-3 md:p-6">

    <div class="max-w-6xl mx-auto space-y-4">
        <div class="livin-header p-5 rounded-2xl shadow-lg border border-white/10">
            <nav class="top-menu">
                <a href="https://appabsku.github.io/checker/">APK Checker</a>
                <a href="https://appabsku.github.io/nisbah/">📊 ANALISA NISBAH</a>
                <a href="https://appabsku.github.io/datakol/" class="aktif">📑 Ekstrak 234</a>
            </nav>
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h1 class="text-xl font-bold text-white flex items-center gap-2">
                        <span class="w-8 h-8 rounded-lg btn-gold inline-flex items-center justify-center font-black text-sm">L</span>
                        Ekstraktor Multi-PDF Kolektibilitas
                    </h1>
                    <p class="text-xs text-blue-100/80 mt-1 ml-10">Unggah PDF Kolektibilitas & Ambil Data Basil Otomatis via CSV URL.</p>
                </div>

                <div class="flex flex-wrap items-center gap-2">
                    <label class="flex items-center px-4 py-2.5 btn-gold font-bold text-xs rounded-full shadow cursor-pointer">
                        + PDF Kol
                        <input type="file" id="fileInput" accept="application/pdf" multiple class="hidden">
                    </label>

                    <button onclick="fetchDirectCSV()" class="flex items-center px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-full shadow transition">
                        ⚡ Load Data Basil
                    </button>

                    <button id="resetBtn" onclick="resetAllData()" class="hidden px-3 py-2.5 bg-red-100 text-red-700 font-semibold text-xs rounded-full">Reset</button>
                    <button id="exportXlsxBtn" onclick="exportToExcel()" class="hidden px-4 py-2.5 btn-outline-navy font-semibold text-xs rounded-full">Download XLSX</button>
                </div>
            </div>

            <div id="fileListContainer" class="mt-3 text-xs hidden">
                <span class="font-semibold text-blue-100">File Terbaca:</span>
                <ul id="fileList" class="list-disc list-inside text-amber-200 mt-1 space-y-0.5"></ul>
            </div>
        </div>

        <div id="resultContainer" class="hidden bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden">
            <div class="p-3.5 bg-white border-b border-slate-200 flex flex-col md:flex-row justify-between items-center gap-3">
                <div class="flex items-center gap-2">
                    <h2 class="font-bold text-xs text-[var(--mdr-navy-800)] uppercase">Hasil Ekstraksi Data</h2>
                    <span id="rowCount" class="text-xs bg-slate-100 px-2.5 py-1 rounded-full font-bold">0 Data</span>
                </div>

                <div class="filter-segment">
                    <label><input type="radio" name="viewMode" value="all" onchange="toggleViewMode()"><span>Semua Data</span></label>
                    <label><input type="radio" name="viewMode" value="filtered" checked onchange="toggleViewMode()"><span>Gabungan Kol 2,3,4</span></label>
                </div>
            </div>

            <div class="overflow-x-auto max-h-[650px]">
                <table class="w-full text-left text-xs border-collapse">
                    <thead class="uppercase sticky top-0">
                        <tr>
                            <th class="p-2.5 text-center">No.</th>
                            <th class="p-2.5">Nomor</th>
                            <th class="p-2.5">N a m a</th>
                            <th class="p-2.5">Alamat</th>
                            <th class="p-2.5">Jtp Angsuran</th>
                            <th class="p-2.5 text-right">Saldo</th>
                            <th class="p-2.5 text-center">Kol</th>
                            <th class="p-2.5 text-center col-sudahbayar">sudahbayar</th>
                            <th class="p-2.5 text-center col-basil">basil</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>

        <div id="loading" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-[var(--mdr-navy-800)] border-t-[var(--mdr-gold-500)]"></div>
            <p id="loadingStatus" class="mt-2 text-xs text-[var(--mdr-navy-800)] font-semibold">Memproses data...</p>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // URL Publik CSV Resmi dari Link yang Anda Berikan
        const DIRECT_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTtHNt9YtHZwneyz_8LP2UUOSxsEUvLW3VCqAE0hNh7VVxiCyTQFE5FINtDhbJNWXvs5Wb_B9Dd0CA-/pub?output=csv";

        let parsedData = [];
        let loadedFiles = [];
        let activeViewData = [];
        let parsedBasilMap = [];

        document.getElementById('fileInput').addEventListener('change', handleFiles);

        function cleanToNumber(str) {
            if (!str) return 0;
            let cleanStr = String(str).split(',')[0].replace(/\./g, '').replace(/[^\d]/g, '').trim();
            let num = parseInt(cleanStr, 10);
            return isNaN(num) ? 0 : num;
        }

        function formatNumber(num) {
            if (!num || num === 0 || num === "-") return "-";
            return num.toLocaleString('id-ID');
        }

        function cleanName(name) {
            if (!name) return "";
            return name.toUpperCase().replace(/[^A-Z0-9]/g, '').trim();
        }

        // AMBIL DATA CSV DIRECT TANPA CORS PROXY ERROR
        async function fetchDirectCSV() {
            showLoading(true, "Mengunduh CSV Data Basil...");
            try {
                const response = await fetch(DIRECT_CSV_URL);
                if (!response.ok) throw new Error("Gagal mengunduh CSV");
                
                const csvText = await response.text();
                parseBasilCSV(csvText);
                applyBasilMatching();

                if (!loadedFiles.includes("Google Sheet Basil (CSV Direct)")) {
                    loadedFiles.push("Google Sheet Basil (CSV Direct)");
                }

                updateFileListUI();
                toggleViewMode();
                showLoading(false);
                alert("Berhasil! Data Basil dari link CSV publik telah dimuat & dicocokkan.");
            } catch (err) {
                console.error("Fetch CSV Error:", err);
                showLoading(false);
                alert("Gagal membaca link CSV publik Google Sheets. Pastikan koneksi terhubung.");
            }
        }

        function parseBasilCSV(csvText) {
            parsedBasilMap = [];
            // Parse CSV secara presisi dengan PapaParse
            Papa.parse(csvText, {
                header: false,
                skipEmptyLines: true,
                complete: function(results) {
                    const rows = results.data;
                    rows.forEach(row => {
                        let nameCandidate = "";
                        let numbers = [];

                        row.forEach(cell => {
                            let valStr = String(cell).trim();
                            let num = cleanToNumber(valStr);
                            if (num > 0) numbers.push(num);

                            if (!nameCandidate && valStr && !/^\d+$/.test(valStr) && valStr.length > 3) {
                                nameCandidate = valStr;
                            }
                        });

                        // Ambil nilai basil (biasanya angka terbesar atau kolom pot basil)
                        if (nameCandidate && numbers.length > 0) {
                            let basilVal = numbers[numbers.length - 1]; // Mengambil angka hasil/basil
                            let saldoVal = numbers.length > 1 ? numbers[0] : 0;
                            
                            parsedBasilMap.push({
                                nama: cleanName(nameCandidate),
                                saldo: saldoVal,
                                basil: basilVal
                            });
                        }
                    });
                }
            });
        }

        function applyBasilMatching() {
            if (parsedBasilMap.length === 0 || parsedData.length === 0) return;

            parsedData.forEach(row => {
                if (row.isSubtotal) return;

                const rowNameClean = cleanName(row.nama);
                const rowSaldo = row.saldo;

                let matched = parsedBasilMap.find(b => {
                    let isNameMatch = b.nama && rowNameClean && (rowNameClean.includes(b.nama) || b.nama.includes(rowNameClean));
                    let isSaldoMatch = b.saldo > 0 && Math.abs(b.saldo - rowSaldo) < 1000;
                    return isNameMatch || isSaldoMatch;
                });

                if (matched) {
                    row.basil = matched.basil;
                }
            });
        }

        async function handleFiles(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            showLoading(true, `Membaca ${files.length} file PDF...`);

            for (let file of files) {
                if (loadedFiles.includes(file.name)) continue;
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument(new Uint8Array(arrayBuffer)).promise;
                    let fullTextLines = [];

                    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                        const page = await pdf.getPage(pageNum);
                        const textContent = await page.getTextContent();
                        const linesMap = {};

                        textContent.items.forEach(item => {
                            const yRaw = item.transform[5];
                            let foundY = Object.keys(linesMap).find(y => Math.abs(y - yRaw) < 3.5) || yRaw;
                            if (!linesMap[foundY]) linesMap[foundY] = [];
                            linesMap[foundY].push({ x: item.transform[4], text: item.str });
                        });

                        Object.keys(linesMap).sort((a, b) => b - a).forEach(y => {
                            const lineItems = linesMap[y].sort((a, b) => a.x - b.x);
                            const lineString = lineItems.map(item => item.text).join(" ").replace(/\s+/g, ' ').trim();
                            if (lineString) fullTextLines.push(lineString);
                        });
                    }

                    parsePDFLines(fullTextLines);
                    loadedFiles.push(file.name);
                } catch (err) {
                    console.error(`Gagal baca PDF ${file.name}:`, err);
                }
            }

            // Otomatis fetch CSV jika PDF selesai di-upload
            await fetchDirectCSV();
            e.target.value = '';
        }

        function parsePDFLines(lines) {
            let pendingNasabah = [];
            lines.forEach(line => {
                if (line.includes(":") || line.match(/^\d{2}-\d{4}/)) return;

                const subtotalMatch = line.match(/^\d+\s+(\d{2,3})\s+([A-Z\s\.]+)\s+([\d\.,]+)\s+([\d\.,]+)/);
                const rekMatch = line.match(/\b(\d{2}-\d{4,5})\b/);

                if (subtotalMatch) {
                    const currentMktCode = subtotalMatch[1].padStart(3, '0');
                    pendingNasabah.forEach(n => n.mktCode = currentMktCode);
                    pendingNasabah = [];

                    parsedData.push({
                        noRek: currentMktCode, mktCode: currentMktCode,
                        nama: `${currentMktCode} ${subtotalMatch[2].trim()}`,
                        alamat: "-", jtpAngs: "-", saldo: cleanToNumber(subtotalMatch[4]),
                        kol: "-", sudahbayar: "", basil: "", isSubtotal: true
                    });
                } else if (rekMatch) {
                    const noRek = rekMatch[1];
                    const dateMatches = line.match(/\b\d{2}-\d{2}-\d{4}\b/g);
                    let jtpAngs = dateMatches ? (dateMatches[1] || dateMatches[0]) : "-";

                    const numberMatches = line.match(/\b\d{1,3}(\.\d{3})*,\d{2}\b/g);
                    let saldoNum = numberMatches ? cleanToNumber(numberMatches[numberMatches.length - 1]) : 0;

                    let kol = "4";
                    const kolMatch = line.match(/\b(\d{1}\s+hari)\s+(\d{1})\b/i) || line.match(/\s+([1-5])\s*$/);
                    if (kolMatch) kol = kolMatch[2] || kolMatch[1];

                    let namaPart = line.substring(line.indexOf(noRek) + noRek.length).split(/\d{2}-\d{2}-\d{4}/)[0].trim();

                    const nasabahRow = {
                        noRek, mktCode: "999", nama: namaPart || "NASABAH",
                        alamat: "-", jtpAngs, saldo: saldoNum, kol: String(kol).trim(),
                        sudahbayar: "", basil: "", isSubtotal: false
                    };

                    parsedData.push(nasabahRow);
                    pendingNasabah.push(nasabahRow);
                }
            });
        }

        function toggleViewMode() {
            const mode = document.querySelector('input[name="viewMode"]:checked')?.value || 'filtered';
            if (mode === "filtered") {
                activeViewData = parsedData.filter(r => ["2","3","4","-"].includes(r.kol));
            } else {
                activeViewData = parsedData;
            }
            renderTable(activeViewData);
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            data.forEach((row, idx) => {
                const tr = document.createElement('tr');
                tr.className = row.isSubtotal ? 'row-subtotal font-bold' : (idx % 2 === 0 ? 'row-even' : 'row-odd');

                tr.innerHTML = `
                    <td class="p-2.5 text-center font-medium">${idx + 1}</td>
                    <td class="p-2.5 font-mono text-[var(--mdr-navy-800)]">${row.noRek}</td>
                    <td class="p-2.5 font-bold">${row.nama}</td>
                    <td class="p-2.5 text-slate-600">${row.alamat}</td>
                    <td class="p-2.5 whitespace-nowrap">${row.jtpAngs}</td>
                    <td class="p-2.5 text-right font-mono font-semibold text-[var(--mdr-navy-800)]">${formatNumber(row.saldo)}</td>
                    <td class="p-2.5 text-center"><span class="kol-badge kol-${row.kol}">${row.kol}</span></td>
                    <td class="p-2.5 text-center font-mono bg-amber-50/60">${row.sudahbayar || ''}</td>
                    <td class="p-2.5 text-right font-mono text-emerald-700 bg-emerald-50/60 font-semibold">${formatNumber(row.basil)}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('rowCount').innerText = `${data.length} Baris Tampil`;
            document.getElementById('resultContainer').classList.remove('hidden');
            document.getElementById('exportXlsxBtn').classList.remove('hidden');
        }

        function updateFileListUI() {
            const container = document.getElementById('fileListContainer');
            const ul = document.getElementById('fileList');
            ul.innerHTML = loadedFiles.map(f => `<li>${f}</li>`).join('');
            container.classList.toggle('hidden', loadedFiles.length === 0);
            document.getElementById('resetBtn').classList.toggle('hidden', loadedFiles.length === 0);
        }

        function resetAllData() {
            parsedData = []; loadedFiles = []; activeViewData = []; parsedBasilMap = [];
            document.getElementById('resultContainer').classList.add('hidden');
            updateFileListUI();
        }

        function showLoading(isLoading, message = "Memproses...") {
            document.getElementById('loading').classList.toggle('hidden', !isLoading);
            document.getElementById('loadingStatus').innerText = message;
        }
    </script>
</body>
</html>
